<!-- Optional integrations are loaded after first paint / on demand. -->
<script>
(function () {
  const OPTIONAL_SCRIPTS = {
    botpressInject: "https://cdn.botpress.cloud/webchat/v3.7/inject.js",
    botpressConfig: "https://files.bpcontent.cloud/2026/10/18/10/20261018104239-YPIAFXCZ.js",
    emailjs: "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
  };
  const optionalLoads = new Map();

  window.FW_LOAD_SCRIPT = function (key) {
    if (optionalLoads.has(key)) return optionalLoads.get(key);
    const src = OPTIONAL_SCRIPTS[key];
    if (!src) return Promise.reject(new Error("Unknown optional script: " + key));
    const p = new Promise((resolve, reject) => {
      const existing = document.querySelector('script[data-fw-optional="' + key + '"]');
      if (existing) {
        existing.addEventListener("load", () => resolve(), { once: true });
        existing.addEventListener("error", () => reject(new Error("Failed to load " + key)), { once: true });
        if (existing.dataset.loaded === "1") resolve();
        return;
      }
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.dataset.fwOptional = key;
      s.onload = () => { s.dataset.loaded = "1"; resolve(); };
      s.onerror = () => reject(new Error("Failed to load " + key));
      document.head.appendChild(s);
    });
    optionalLoads.set(key, p);
    return p;
  };

  window.FW_SCHEDULE_OPTIONAL = function () {
    const run = () => {
      if (run.done) return;
      run.done = true;
      window.FW_LOAD_SCRIPT("botpressInject")
        .then(() => window.FW_LOAD_SCRIPT("botpressConfig"))
        .catch(() => {});
    };
    // The webchat is a non-critical third party. Load it on the first real
    // interaction (or after 20s), not during the Lighthouse measurement window.
    ["pointerdown", "keydown", "touchstart"].forEach((eventName) => {
      window.addEventListener(eventName, run, { once: true, passive: true });
    });
    setTimeout(run, 20000);
  };
})();
</script>

function uid8() { return Math.random().toString(36).slice(2, 10); }

function distanceKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function esc(s) {

    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")

}

/* ---- Multi-problem helpers ---- */
function cartPriceLabel(problemKeys, vehicleType) {
  const list = problemsFor(vehicleType);
  const nums = [];
  const extras = new Set();
  let hasEstimation = false;
  problemKeys.forEach((k) => {
    const svc = list.find((p) => p.key === k);
    if (!svc) return;
    const m = svc.price.match(/PKR\s*([\d,]+)/);
    if (m) {
      nums.push(parseInt(m[1].replace(/,/g, ""), 10));
      if (/\+\s*fuel/i.test(svc.price)) extras.add("fuel");
      if (/\+\s*oil/i.test(svc.price)) extras.add("oil");
    } else {
      hasEstimation = true;
    }
  });
  const parts = [];
  if (nums.length > 0) {
    const sum = nums.reduce((a, b) => a + b, 0);
    let base = `PKR ${sum.toLocaleString("en-PK")}`;
    extras.forEach((e) => { base += ` + ${e}`; });
    parts.push(base);
  }
  if (hasEstimation) parts.push("On estimation");
  if (parts.length === 0) return "On estimation";
  return parts.join(" · ");
}

function requiredExpertiseFor(problemKeys, vehicleType) {
  const list = problemsFor(vehicleType);
  const set = new Set();
  problemKeys.forEach((k) => {
    const svc = list.find((p) => p.key === k);
    if (svc && svc.expertise) set.add(svc.expertise);
  });
  return Array.from(set);
}

/* Parse the pipe-delimited problem_type string into problem labels. */
function parseProblemLabels(problemType) {
  if (!problemType) return [];
  const s = String(problemType);
  if (s.includes(" | ")) return s.split(" | ").map((x) => x.trim()).filter(Boolean);
  return [s.trim()];
}

/* Given a job row, work out which expertise(s) are needed to serve it.
   Handles both new (multi) and legacy (single, fuel-suffixed) payloads. */
function requiredExpertiseForJob(job) {
  const labels = parseProblemLabels(job.problem_type);
  const vehicleType = job.vehicle_type || "bike";
  const set = new Set();
  labels.forEach((label) => {
    const base = label.split(" ·")[0].trim();
    const list = problemsFor(vehicleType);
    const svc = list.find((p) => p.key === base);
    if (svc && svc.expertise) set.add(svc.expertise);
    else set.add(vehicleType === "car" ? "car_mechanic" : "bike_mechanic");
  });
  return Array.from(set);
}

function jobMatchesMechanic(job, expertise) {
  if (job.mechanic_id && job.mechanic_id !== state.uid) return false;
  if (!expertise || expertise.length === 0) return true;      // opt-out (no expertise set)
  const req = requiredExpertiseForJob(job);
  if (req.length === 0) return true;
  return req.every((e) => expertise.includes(e));
}

/* ============================= PHOTO UPLOADS ============================= */
function loadImageElement(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read that image")); };
    img.src = url;
  });
}
async function compressImage(file, maxDim, quality) {
  const targetMax = maxDim || 1280;
  const q = quality || 0.78;
  let bitmap = null, img = null, canvas = null;
  try {
    let srcW = 0, srcH = 0;
    if (typeof createImageBitmap === "function") {
      try {
        const probe = await createImageBitmap(file);
        srcW = probe.width; srcH = probe.height;
        try { probe.close && probe.close(); } catch (e) {}
        const scale = Math.min(1, targetMax / Math.max(srcW, srcH));
        if (scale < 1) {
          const w = Math.max(1, Math.round(srcW * scale));
          const h = Math.max(1, Math.round(srcH * scale));
          bitmap = await createImageBitmap(file, {
            resizeWidth: w, resizeHeight: h, resizeQuality: "high", imageOrientation: "from-image",
          });
        } else {
          bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
        }
        srcW = bitmap.width; srcH = bitmap.height;
      } catch (e) {
        if (bitmap) { try { bitmap.close && bitmap.close(); } catch (e2) {} bitmap = null; }
      }
    }
    if (!bitmap) {
      img = await loadImageElement(file);
      srcW = img.naturalWidth || img.width;
      srcH = img.naturalHeight || img.height;
    }
    if (!srcW || !srcH) return file;

    const scale = Math.min(1, targetMax / Math.max(srcW, srcH));
    const w = Math.max(1, Math.round(srcW * scale));
    const h = Math.max(1, Math.round(srcH * scale));

    canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    if (!ctx) return file;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    if (bitmap) ctx.drawImage(bitmap, 0, 0, w, h);
    else ctx.drawImage(img, 0, 0, w, h);

    const blob = await new Promise((resolve) => {
      try { canvas.toBlob((b) => resolve(b), "image/jpeg", q); }
      catch (e) { resolve(null); }
    });
    return blob || file;
  } catch (e) {
    console.warn("Image compression skipped:", e && e.message);
    return file;
  } finally {
    if (bitmap) { try { bitmap.close && bitmap.close(); } catch (e) {} }
    if (img) { try { img.src = ""; } catch (e) {} }
    if (canvas) { try { canvas.width = 1; canvas.height = 1; } catch (e) {} }
  }
}
function uploadPhotoAttempt(folder, publicId, file, onProgress) {
  return new Promise((resolve, reject) => {
    const formData = new FormData();
    formData.append("file", file, `${publicId}.jpg`);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    formData.append("folder", folder);
    formData.append("public_id", publicId);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`);
    xhr.timeout = 90000;
    xhr.upload.onprogress = (e) => { if (onProgress && e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100)); };
    xhr.onload = () => {
      let res = null;
      try { res = JSON.parse(xhr.responseText); } catch (err) {}
      if (xhr.status >= 200 && xhr.status < 300 && res && res.secure_url) resolve(res.secure_url);
      else reject(new Error((res && res.error && res.error.message) || `Upload failed (HTTP ${xhr.status})`));
    };
    xhr.onerror = () => reject(new Error("Network error during upload"));
    xhr.ontimeout = () => reject(new Error("Upload timed out"));
    xhr.onabort = () => reject(new Error("Upload cancelled"));
    xhr.send(formData);
  });
}
async function uploadPhotoToCloudinary(folder, publicId, file, onProgress) {
  if (!CLOUDINARY_CLOUD_NAME || CLOUDINARY_CLOUD_NAME.startsWith("YOUR_")) {
    console.warn("Cloudinary not configured — skipping upload:", publicId);
    return null;
  }
  const MAX_ATTEMPTS = 3;
  let lastErr = null;
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    try {
      if (onProgress) onProgress(0);
      const id = attempt === 1 ? publicId : `${publicId}-r${attempt}`;
      return await uploadPhotoAttempt(folder, id, file, onProgress);
    } catch (e) {
      lastErr = e;
      console.warn(`Cloudinary upload attempt ${attempt}/${MAX_ATTEMPTS} failed:`, e && e.message);
      if (attempt < MAX_ATTEMPTS) await new Promise((r) => setTimeout(r, 700 * attempt));
    }
  }
  throw lastErr || new Error("Upload failed");
}

let alertAudioCtx = null;
function unlockAudio() {
  try {
    if (!alertAudioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      alertAudioCtx = new Ctx();
    }
    if (alertAudioCtx.state === "suspended") void alertAudioCtx.resume();
  } catch (e) {}
}
document.addEventListener("pointerdown", unlockAudio, { passive: true });

function playRequestBeep() {
  try {
    unlockAudio();
    const ctx = alertAudioCtx;
    if (!ctx) return;
    if (ctx.state === "suspended") void ctx.resume();
    const t0 = ctx.currentTime + 0.02;
    [[0, 880], [0.22, 1180], [0.44, 880]].forEach(([offset, freq]) => {
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t0 + offset);
      gain.gain.setValueAtTime(0.0001, t0 + offset);
      gain.gain.exponentialRampToValueAtTime(0.28, t0 + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + offset + 0.17);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0 + offset); osc.stop(t0 + offset + 0.2);
    });
  } catch (e) {}
}

/* Ding-dong bell with inharmonic partials. */
function playBellRing() {
  try {
    unlockAudio();
    const ctx = alertAudioCtx;
    if (!ctx) return;
    if (ctx.state === "suspended") void ctx.resume();
    const t0 = ctx.currentTime + 0.02;
    const strike = (startTime, fundamental, volume) => {
      const partials = [
        [fundamental,        1.00, 1.10],
        [fundamental * 2.00, 0.55, 0.85],
        [fundamental * 2.40, 0.38, 0.70],
        [fundamental * 3.00, 0.28, 0.55],
        [fundamental * 4.20, 0.16, 0.42],
        [fundamental * 5.40, 0.10, 0.30],
      ];
      partials.forEach(([freq, gain, decay]) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, startTime);
        g.gain.setValueAtTime(0.0001, startTime);
        g.gain.exponentialRampToValueAtTime(volume * gain, startTime + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, startTime + decay);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(startTime); osc.stop(startTime + decay + 0.05);
      });
    };
    strike(t0,        1318.5, 0.36);
    strike(t0 + 0.38, 1046.5, 0.32);
  } catch (e) {}
}

function checkNewPendingAlerts(jobs) {
  const fresh = (jobs || []).filter((j) => j.status === "pending" && !j.mechanic_id);

document.addEventListener("change", (e) => {
  const t = e.target.closest("[data-file]");
  if (t && t.files && t.files[0]) { state.auth.photoFile = t.files[0]; render(); return; }

  const j = e.target.closest("[data-jobphoto]");
  if (!j || !j.files || !j.files[0]) return;

  const which = j.getAttribute("data-jobphoto");
  const jobId = j.getAttribute("data-jobid");
  const rawFile = j.files[0];
  j.value = "";

  const m = state.mechanic;
  if (m[which + "Compressing"] || m[which + "Uploading"]) {
    toast("Please wait for the current photo to finish uploading.", "default");
    return;
  }
  if (!jobId) { toast("Job reference lost — please refresh.", "error"); return; }

  const oldPreview = m[which + "Preview"];
  m[which + "Compressing"] = true;
  m.uploadErrors[jobId + ":" + which] = null;
  render();

  compressImage(rawFile, 1280, 0.75)
    .then((blob) => {
      if (oldPreview && oldPreview !== m[which + "Preview"]) {
        try { URL.revokeObjectURL(oldPreview); } catch (e) {}
      }
      m[which + "Preview"] = URL.createObjectURL(blob);
      m[which + "Compressing"] = false;
      render();
      void uploadJobPhotoStep(which, blob, jobId);
    })
    .catch((err) => {
      m[which + "Compressing"] = false;
      m.uploadErrors[jobId + ":" + which] = err && err.message ? err.message : "Couldn't read image";
      toast("Couldn't read that image — try a different photo.", "error");
      render();
    });
});

async function uploadJobPhotoStep(which, blob, jobId) {
  const m = state.mechanic;
  const id = jobId || (m.jobs.find(j => j.mechanic_id === state.uid) || {}).id;
  if (!id) { toast("Job no longer available — refresh and try again.", "error"); return; }

  const lockKey = id + ":" + which;
  if (m.uploadLocks[lockKey]) return;
  m.uploadLocks[lockKey] = true;
  m.pendingBlobs[lockKey] = blob;
  m.uploadErrors[lockKey] = null;

  m[which + "Uploading"] = true;
  m[which + "UploadPct"] = 0;
  render();

  const stamp = Date.now();
  let url;
  try {
    url = await uploadPhotoToCloudinary(
      "job-photos", `${id}-${which}-${stamp}`, blob,
      (pct) => { m[which + "UploadPct"] = pct; render(); }
    );
    if (!url) throw new Error("Cloudinary isn't set up yet.");
  } catch (e) {
    m[which + "Uploading"] = false;
    m.uploadErrors[lockKey] = e && e.message ? e.message : "Upload failed";
    delete m.uploadLocks[lockKey];
    toast(`Couldn't upload the ${which} photo — ${m.uploadErrors[lockKey]}`, "error");
    render();
    return;
  }

  const { error } = await sb.from("service_requests").update({ [`${which}_photo_url`]: url }).eq("id", id);
  m[which + "Uploading"] = false;
  delete m.uploadLocks[lockKey];

  if (error) {
    m.uploadErrors[lockKey] = error.message;
    toast(error.message, "error");
    render();
    return;
  }

  // Local state is source-of-truth — write back immediately so a stale realtime
  // refresh can't make the slot look empty and force a retry.
  const live = state.mechanic.jobs.find((j) => j.id === id);
  if (live) live[`${which}_photo_url`] = url;

  if (m[which + "Preview"]) {
    try { URL.revokeObjectURL(m[which + "Preview"]); } catch (e) {}
    m[which + "Preview"] = null;
  }
  m[which + "UploadPct"] = 0;
  delete m.pendingBlobs[lockKey];
  m.uploadErrors[lockKey] = null;

  toast(`${which === "before" ? "Before" : "After"} photo saved`, "success");
  render();
}

function retryPhotoUpload(which) {
  const m = state.mechanic;
  const job = m.jobs.find(j => j.mechanic_id === state.uid);
  if (!job) return;
  const lockKey = job.id + ":" + which;
  const blob = m.pendingBlobs[lockKey];
  if (!blob) { toast("Nothing to retry — pick the photo again.", "default"); return; }
  m.uploadErrors[lockKey] = null;
  void uploadJobPhotoStep(which, blob, job.id);
}

function toggleTheme() { state.theme = state.theme === "dark" ? "light" : "dark"; saveLocal("fixwheels_theme", state.theme); applyTheme(); render(); }

/* ============================= BOOT / SESSION ============================= */
async function boot() {
  applyTheme();
  render(); // Render the UI instantly to fix LCP
  if (window.FW_SCHEDULE_OPTIONAL) window.FW_SCHEDULE_OPTIONAL();

  // Defer heavy network calls by 10ms to not block the main thread (fixes TBT)
  setTimeout(async () => {
    try {
      installManifest();
      
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        state.uid = session.user.id;
        state.accessToken = session.access_token;
        await loadMyProfile();
        
        state.screen = state.profile ? (state.profile.role === "mechanic" ? "mechanic" : "customer") : "role";
        render();
        
        if (state.profile) {
          requestGeo(); 
          startPresenceFeed(); 
          startHeartbeat();
          if (state.profile.role === "customer") startCustomerFeeds();
          else { 
            startMechanicFeeds(); 
            if (state.mechanic.online) startMechanicLocationWatch(); 
          }
        }
      }
      sb.auth.onAuthStateChange((_event, session2) => { 
        state.accessToken = session2 ? session2.access_token : null; 
      });
    } catch (err) {
      console.error("Deferred boot error:", err);
    }
  }, 10);
}
function installManifest() {
  if (document.querySelector('link[rel="manifest"]')) return;
  try {
    const manifest = {
      name: "FixWheels", short_name: "FixWheels",
      start_url: ".", scope: ".", display: "standalone",
      background_color: "#ffffff", theme_color: "#0f3360",
      description: "Any vehicle, any time, anywhere.",
      icons: [
        { src: FW_ASSETS.icon192, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: FW_ASSETS.icon512, sizes: "512x512", type: "image/png", purpose: "any" },
        { src: FW_ASSETS.icon512, sizes: "512x512", type: "image/png", purpose: "maskable" },
      ],
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
    const link = document.createElement("link");
    link.rel = "manifest"; link.href = url;
    document.head.appendChild(link);
  } catch (e) {}
}
async function loadMyProfile() {
  const colsWithExp = "role, full_name, phone, cnic, is_online, is_verified, photo_url, rating_avg, rating_count, expertise";
  const colsWithout = "role, full_name, phone, cnic, is_online, is_verified, photo_url, rating_avg, rating_count";
  let { data, error } = await sb.from("profiles").select(colsWithExp).eq("id", state.uid).maybeSingle();
  if (error && /column .* does not exist/i.test(error.message)) {
    const fb = await sb.from("profiles").select(colsWithout).eq("id", state.uid).maybeSingle();
    data = fb.data;
    if (data) data.expertise = loadLocal("fixwheels_expertise_" + state.uid, []);
  }
  state.profile = data || null;
  if (state.profile) {
    state.mechanic.online = !!state.profile.is_online;
    state.mechanic.expertise = Array.isArray(data.expertise) ? data.expertise.slice() : [];
  }
}
async function ensureAnonSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { state.uid = session.user.id; state.accessToken = session.access_token; return session; }
  const { data, error } = await sb.auth.signInAnonymously();
  if (error) throw error;
  state.uid = data.session.user.id;
  state.accessToken = data.session.access_token;
  return data.session;
}
function refreshLiveState() {
  if (!state.profile) return;
  if (state.profile.role === "mechanic") { if (!state.mechanic.completing) void loadJobs(); void resyncMechanicOnlineState(); }
  else void loadActiveRequest();
}
async function resyncMechanicOnlineState() {
  if (!state.uid || !state.mechanic.online) return;
  const { data } = await sb.from("profiles").select("is_online").eq("id", state.uid).maybeSingle();
  if (data && !data.is_online) {
    state.mechanic.online = false; stopMechanicLocationWatch();
    toast("You were set offline after losing connection for a while — go online again when you're ready.", "default");
    render();
  }
}

async function completeSignup() {
  const a = state.auth;
  if (a.fullName.trim().length < 2) return toast("Please enter your full name", "error");

  if (a.role === "mechanic" && a.cnic.replace(/[^0-9]/g, "").length !== 13) return toast("Please enter your 13-digit CNIC number", "error");
  if (a.role === "mechanic" && a.expertise.length === 0) return toast("Select at least one area of expertise", "error");
  if (a.role === "mechanic" && !a.photoFile) return toast("Please add a profile photo", "error");

    if (error && /could not find function|function .* does not exist|p_expertise|unknown/i.test(error.message) && a.role === "mechanic") {
      // Fallback for older RPC signature — call without expertise then update separately.
      const fbArgs = { p_phone: a.phone, p_role: a.role, p_full_name: a.fullName.trim(), p_cnic: a.cnic.trim() };

    if (a.role === "mechanic" && a.photoFile) {
      a.busyLabel = "Uploading photo…"; render();
      try {

    await loadMyProfile();
    toast("Welcome to FixWheels!", "success");
    state.screen = a.role === "mechanic" ? "mechanic" : "customer";
    render();
    requestGeo(); startPresenceFeed(); startHeartbeat();
    if (a.role === "mechanic") startMechanicFeeds(); else startCustomerFeeds();
  } catch (e) {
    toast(e.message || "Could not set up your account", "error");
  } finally {

  }
}
function friendlyDbError(msg) {

  if (/area of expertise is locked|expertise cannot be changed|expertise.*immutable|expertise.*locked/i.test(s)) return "Your area of expertise is locked after registration. Contact FixWheels admin for a correction.";
  if (/phone/i.test(s) && /unique|duplicate/i.test(s)) return "That phone number is already registered on FixWheels.";
  if (/expertise/i.test(s)) return "Please select at least one area of expertise.";

}

async function computeUnreadFromServer(jobId) {
  if (!jobId || !state.uid) return;
  const lastRead = getLastRead(jobId);
  try {
    const { count } = await sb.from("job_messages")
      .select("id", { count: "exact", head: true })
      .eq("job_id", jobId)
      .neq("sender_id", state.uid)
      .gt("created_at", new Date(lastRead).toISOString());
    state.chat.unread = count || 0;
    render();
  } catch (e) {}
}
function syncChatFeed(jobId) {
  if (state.chat.feedJobId === jobId && state.chat.channel) return;
  stopChatFeed();
  if (!jobId) return;
  state.chat.feedJobId = jobId;
  void computeUnreadFromServer(jobId);

  const ch = sb.channel("chat-" + jobId)
    .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "job_messages", filter: "job_id=eq." + jobId },
        (payload) => {
          const msg = payload.new;
          if (!msg || msg.job_id !== jobId) return;
          if (msg.sender_id === state.uid) return;
          const viewingThisChat = state.chat.open && state.chat.jobId === jobId;
          if (viewingThisChat) {
            if (!state.chat.messages.some((m) => m.id === msg.id)) state.chat.messages.push(msg);
            setLastRead(jobId);
            playBellRing();
            render();
            scrollChatToBottom();
          } else {
            state.chat.unread = (state.chat.unread || 0) + 1;
            playBellRing();
            playChatVibration();
            showNotification("New message", `${msg.sender_name}: ${msg.body}`.slice(0, 80));
            render();
          }
        })
    .subscribe();

  state.chat.channel = ch;
  state._channels.push(ch);
}
function stopChatFeed() {
  if (state.chat.channel) {
    try { sb.removeChannel(state.chat.channel); } catch (e) {}
    state._channels = state._channels.filter((c) => c !== state.chat.channel);
    state.chat.channel = null;
  }
  state.chat.feedJobId = null;
}
async function loadChatMessages(jobId) {
  const { data, error } = await sb.from("job_messages")
    .select("id, job_id, sender_id, sender_name, body, created_at")
    .eq("job_id", jobId).order("created_at", { ascending: true }).limit(200);
  if (error) { console.warn("loadChatMessages", error); return; }
  const byId = new Map();
  (data || []).forEach((m) => byId.set(m.id, m));
  state.chat.messages.forEach((m) => { if (!byId.has(m.id)) byId.set(m.id, m); });
  state.chat.messages = Array.from(byId.values()).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  render();
  scrollChatToBottom();
}
function scrollChatToBottom() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const el = document.querySelector("[data-chat-scroll]");
    if (el) el.scrollTop = el.scrollHeight;
  }));
}
function openChat(jobId, peerLabel, peerPhone) {
  if (!jobId) return;
  state.chat.open = true;
  state.chat.jobId = jobId;
  state.chat.peerLabel = peerLabel || "Chat";
  state.chat.peerPhone = peerPhone || "";
  state.chat.unread = 0;
  state.chat.draft = "";
  setLastRead(jobId);
  render();
  void loadChatMessages(jobId);
}
function closeChat() {
  state.chat.open = false;
  state.chat.draft = "";
  state.chat.jobId = null;
  state.chat.messages = [];
  render();
}
async function sendChatMessage() {
  const body = state.chat.draft.trim();
  if (!body || !state.chat.jobId || state.chat.sending) return;
  state.chat.sending = true;
  state.chat.draft = "";
  render();
  const payload = {
    job_id: state.chat.jobId,
    sender_id: state.uid,
    sender_name: state.profile.full_name,
    body: body.slice(0, 1000),
  };
  const { data, error } = await sb.from("job_messages").insert(payload).select("id, job_id, sender_id, sender_name, body, created_at").maybeSingle();
  state.chat.sending = false;
  if (error) {
    toast("Couldn't send: " + error.message, "error");
    state.chat.draft = body;
    render();
    return;
  }
  if (data && !state.chat.messages.some((m) => m.id === data.id)) state.chat.messages.push(data);
  setLastRead(state.chat.jobId);
  render();
  scrollChatToBottom();
}

async function loadActiveRequest() {
  const prevActive = state.customer.active;
  const prevId = prevActive ? prevActive.id : null;

  const { data } = await sb.from("service_requests").select("*").eq("customer_id", state.uid)
    .in("status", ["pending", "accepted", "on_the_way", "completed"])
    .order("created_at", { ascending: false }).limit(1).maybeSingle();

  let nextActive = data || null;
  if (nextActive && nextActive.status === "completed" && isJobDismissed(nextActive.id)) nextActive = null;

  if (prevId && !nextActive) {
    const { data: closed } = await sb.from("service_requests").select("status, status_reason").eq("id", prevId).maybeSingle();
    if (closed && closed.status === "cancelled" && closed.status_reason === "timeout_customer_offline") {
      toast("Your request was cancelled — you were offline for over 30 seconds.", "default");
    }
  }

  state.customer.active = nextActive;
  if (!nextActive || (prevId !== nextActive.id)) state.customer.txId = "";

  if (state.chat.open && state.chat.jobId && (!nextActive || state.chat.jobId !== nextActive.id || nextActive.status === "completed" || nextActive.status === "cancelled")) {
    closeChat();
  }

  const callable = nextActive && nextActive.mechanic_id && nextActive.status !== "completed";
  if (callable) {
    void loadActiveMechanic(nextActive.mechanic_id);
    ensureCallChannel(nextActive.id, state.customer.mechanic ? state.customer.mechanic.full_name : "Mechanic", state.customer.mechanic ? state.customer.mechanic.phone : "");
    syncChatFeed(nextActive.id);
  } else {
    state.customer.mechanic = null;
    closeCallChannel();
    stopChatFeed();
    state.chat.unread = 0;
  }
  render();
}
async function loadActiveMechanic(mechanicId) {
  const { data } = await sb.from("profiles")
    .select("full_name, lat, lng, photo_url, phone, rating_avg, rating_count")
    .eq("id", mechanicId).maybeSingle();
  state.customer.mechanic = data || null;
  if (data && state.customer.active && state.customer.active.status !== "completed") {

function startCustomerFeeds() {

}

async function submitRequest() {
  const c = state.customer;
  if (c.problems.length === 0) return toast(`Pick at least one problem with your ${c.vehicleType === "car" ? "car" : "bike"}`, "error");
  const hasOther = c.problems.some((k) => k.startsWith("Other"));
  if (hasOther && c.note.trim().length < 3) return toast("Tell us briefly about the 'Other' problem", "error");
  if (!state.geo.coords) return toast("We still need your location — allow location access and try again", "error");

  const problemsList = c.problems.map((key) => {
    const svc = serviceOf(key, c.vehicleType);
    if (!svc) return null;
    let label = svc.key;
    if (svc.fuel) label = `${svc.key} · ${c.fuelQty}L`;
    return { key: label, price: svc.price, expertise: svc.expertise };
  }).filter(Boolean);
  const requiredExpertise = Array.from(new Set(problemsList.map((p) => p.expertise).filter(Boolean)));

  c.busy = true; render();
  const payload = {
    customer_id: state.uid,
    customer_name: state.profile.full_name,
    customer_phone: state.profile.phone,
    problem_type: problemsList.map((p) => p.key).join(" | "),
    problem_note: c.note.trim() || null,
    bike_model: c.bikeModel.trim() || null,
    bike_reg_no: c.bikeReg.trim() || null,
    landmark: c.landmark.trim() || null,
    service_price: cartPriceLabel(c.problems, c.vehicleType),
    payment_method: c.payment,
    vehicle_type: c.vehicleType,
    service_mode: "roadside",
    lat: state.geo.coords.lat,
    lng: state.geo.coords.lng,
    problems: problemsList,
    required_expertise: requiredExpertise,
  };

  let { error } = await sb.from("service_requests").insert(payload);
  if (error && /column .* does not exist/i.test(error.message)) {
    // Migration not run — retry without the new optional columns.
    const { problems, required_expertise, ...basic } = payload;
    const retry = await sb.from("service_requests").insert(basic);
    error = retry.error;
  }
  c.busy = false;
  if (error) { toast(friendlyDbError(error.message), "error"); render(); return; }
  toast("Request sent. Qualified mechanics are being notified.", "success");
  c.problems = []; c.note = ""; c.bikeModel = ""; c.bikeReg = ""; c.landmark = "";
  await loadActiveRequest();
}

async function loadJobs() {
  const prevMine = state.mechanic.jobs.find((j) => j.mechanic_id === state.uid);
  const prevSnapshot = JSON.stringify(state.mechanic.jobs);
  const prevById = new Map(state.mechanic.jobs.map(j => [j.id, j]));

  const { data, error } = await sb.rpc("list_jobs_for_me");
  if (!error) {
    const merged = (data || []).map(j => {
      const prev = prevById.get(j.id);
      if (prev) {
        if (prev.before_photo_url && !j.before_photo_url) j.before_photo_url = prev.before_photo_url;
        if (prev.after_photo_url  && !j.after_photo_url)  j.after_photo_url  = prev.after_photo_url;
      }
      return j;
    });
    // Filter out pending jobs the mechanic isn't qualified for (client-side, no DB required).
    state.mechanic.jobs = merged.filter(j => j.mechanic_id === state.uid || jobMatchesMechanic(j, state.mechanic.expertise));
    checkNewPendingAlerts(state.mechanic.jobs);
    const mine = state.mechanic.jobs.find((j) => j.mechanic_id === state.uid);
    if (prevMine && (!mine || mine.id !== prevMine.id)) {
      const { data: closed } = await sb.from("service_requests").select("status, status_reason").eq("id", prevMine.id).maybeSingle();
      if (closed && closed.status_reason === "timeout_mechanic_offline") {
        toast("That job was released back to the pool — you were offline for over 30 seconds.", "error");
        resetJobPhotos();
      }
    }
    if (state.chat.open && state.chat.jobId && (!mine || mine.id !== state.chat.jobId)) closeChat();
    if (mine) {
      ensureCallChannel(mine.id, mine.customer_name || "Customer", mine.customer_phone || "");
      syncChatFeed(mine.id);
    } else {
      closeCallChannel();
      stopChatFeed();
      state.chat.unread = 0;
    }
    if (JSON.stringify(state.mechanic.jobs) === prevSnapshot) return;
  }
  render();
}
function startMechanicFeeds() {

  const ch = sb.channel("mech-jobs").on("postgres_changes", { event: "*", schema: "public", table: "service_requests" }, () => void loadJobs()).subscribe();

async function releaseJob(job) {

  await loadJobs();

/* ============================= WEBRTC CALLING ============================= */
let callChannel = null, callPC = null, callLocalStream = null, callPendingIce = [];
let callChannelReady = false;

function ensureCallChannel(jobId, peerLabel, peerPhone) {
  if (!jobId) { closeCallChannel(); return; }
  if (callChannel && state.call.jobId === jobId) {
    if (peerLabel) state.call.peerLabel = peerLabel;
    if (peerPhone) state.call.peerPhone = peerPhone;
    return;
  }
  closeCallChannel();
  callChannelReady = false;
  state.call = idleCall();
  state.call.jobId = jobId;
  state.call.peerLabel = peerLabel || "Call";
  state.call.peerPhone = peerPhone || "";
  callChannel = sb.channel("call-" + jobId, { config: { private: true, broadcast: { self: false } } });
  callChannel.on("broadcast", { event: "ring" }, () => { if (state.call.state === "idle") { state.call.state = "ringing-in"; render(); } });
  callChannel.on("broadcast", { event: "cancel" }, () => { teardownCall(); state.call = idleCall(); render(); });
  callChannel.on("broadcast", { event: "accept" }, () => void callAsCaller());
  callChannel.on("broadcast", { event: "offer" }, ({ payload }) => void callAsCallee(payload.sdp));
  callChannel.on("broadcast", { event: "answer" }, async ({ payload }) => {
    if (callPC) {
      try { await callPC.setRemoteDescription(payload.sdp); state.call.state = "connected"; startCallTimer(); render(); }
      catch (e) { console.warn("setRemoteDescription(answer) failed", e); }
    }
  });
  callChannel.on("broadcast", { event: "ice" }, async ({ payload }) => {
    if (callPC && callPC.remoteDescription) await callPC.addIceCandidate(payload.candidate).catch(() => {});
    else callPendingIce.push(payload.candidate);
  });
  callChannel.on("broadcast", { event: "hangup" }, () => {
    teardownCall(); state.call.state = "ended"; render();
    track(setTimeout(() => { state.call.state = "idle"; render(); }, 1200));
  });
  callChannel.subscribe((status) => { if (status === "SUBSCRIBED") callChannelReady = true; });
}
function closeCallChannel() {
  if (callChannel) { sb.removeChannel(callChannel); callChannel = null; }
  callChannelReady = false;
  teardownCall();
  state.call = idleCall();
}
function whenCallChannelReady(fn) {
  if (callChannelReady) { fn(); return; }
  let tries = 0;
  const iv = setInterval(() => {
    tries++;
    if (callChannelReady) { clearInterval(iv); fn(); }
    else if (tries > 40) { clearInterval(iv); toast("Couldn't reach the other side — check your connection", "error"); }
  }, 100);
}
function callSend(event, payload) { if (callChannel) void callChannel.send({ type: "broadcast", event, payload: payload || {} }); }
function clearCallFallback() {
  if (state.call.fallbackTimer) { clearTimeout(state.call.fallbackTimer); state.call.fallbackTimer = null; }
  if (state.call.reconnectTimer) { clearTimeout(state.call.reconnectTimer); state.call.reconnectTimer = null; }
}
function armCallFallback(ms, reason) {
  if (state.call.fallbackTimer) { clearTimeout(state.call.fallbackTimer); state.call.fallbackTimer = null; }
  state.call.fallbackTimer = track(setTimeout(() => {
    state.call.fallbackTimer = null;
    if (state.call.state === "ringing-out" || state.call.state === "connecting") promptCallFallback(reason);
  }, ms));
}
function promptCallFallback(reason) {
  const jobId = state.call.jobId, peerLabel = state.call.peerLabel, peerPhone = state.call.peerPhone;
  teardownCall();
  state.call = idleCall();
  if (!jobId) { toast(`Call couldn't connect${reason ? ` (${reason})` : ""}.`, "error"); return; }
  state.callFallback = { open: true, jobId, peerLabel: peerLabel || "the other side", peerPhone: peerPhone || "", reason: reason || "Call couldn't connect" };
  render();
}
function callFallbackToChat(reason) {
  const jobId = state.call.jobId, peerLabel = state.call.peerLabel, peerPhone = state.call.peerPhone;
  teardownCall();
  state.call = idleCall();
  if (jobId) openChat(jobId, peerLabel, peerPhone);
  else toast(`Call couldn't connect${reason ? ` (${reason})` : ""}.`, "error");
}
function closeCallFallback() { state.callFallback = idleCallFallback(); render(); }
function callRetryFromFallback() {
  const fb = state.callFallback;
  closeCallFallback();
  if (!fb.jobId) return;
  ensureCallChannel(fb.jobId, fb.peerLabel, fb.peerPhone);
  callRing();
}
function callPeerViaPhone() {
  const fb = state.callFallback;
  const phone = (fb && fb.peerPhone) || state.call.peerPhone || state.chat.peerPhone;
  const raw = String(phone || "").replace(/[^+0-9]/g, "");
  if (!raw) { toast("No phone number is on file for this contact.", "error"); return; }
  if (state.call.state !== "idle") { callSend("hangup"); teardownCall(); state.call = idleCall(); }
  if (fb && fb.open) closeCallFallback();
  try { window.location.href = "tel:" + raw; } catch (e) { toast("Couldn't open the dialer", "error"); }
  render();
}
function callFallbackToChatInstead() {
  const fb = state.callFallback;
  closeCallFallback();
  if (fb && fb.jobId) openChat(fb.jobId, fb.peerLabel, fb.peerPhone);
}
function dialPeer() {
  const phone = state.chat.peerPhone || state.call.peerPhone;
  const digits = String(phone || "").replace(/[^+0-9]/g, "");
  if (!digits) { toast("No phone number is on file.", "error"); return; }
  try { window.location.href = "tel:" + digits; } catch (e) {}
}
async function getMic() { if (!callLocalStream) callLocalStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false }); return callLocalStream; }
function makePC() {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  pc.onicecandidate = (e) => { if (e.candidate) callSend("ice", { candidate: e.candidate.toJSON() }); };
  pc.ontrack = (e) => { const el = document.getElementById("bm-remote-audio"); if (el) { el.srcObject = e.streams[0]; el.play().catch(() => {}); } };
  pc.onconnectionstatechange = () => {
    if (callPC !== pc) return;
    if (pc.connectionState === "connected") { clearCallFallback(); }
    else if (pc.connectionState === "failed") { promptCallFallback("connection failed"); }
    else if (pc.connectionState === "disconnected") {
      if (state.call.reconnectTimer) clearTimeout(state.call.reconnectTimer);
      state.call.reconnectTimer = track(setTimeout(() => {
        state.call.reconnectTimer = null;
        if (callPC === pc && (pc.connectionState === "disconnected" || pc.connectionState === "failed")) promptCallFallback("connection lost");
      }, 6000));
    }
  };
  callPC = pc;
  return pc;
}
async function callAsCaller() {
  state.call.state = "connecting"; render();
  armCallFallback(20000, "no answer");
  try {
    const stream = await getMic();
    const pc = makePC();
    stream.getTracks().forEach((t) => pc.addTrack(t, stream));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    callSend("offer", { sdp: offer });
  } catch (e) { promptCallFallback("microphone unavailable"); }
}
async function callAsCallee(remoteSdp) {
  state.call.state = "connecting"; render();
  armCallFallback(20000, "couldn't connect");
  try {
    const stream = await getMic();
    const pc = makePC();
    stream.getTracks().forEach((t) => pc.addTrack(t, stream));
    await pc.setRemoteDescription(remoteSdp);
    for (const c of callPendingIce) await pc.addIceCandidate(c).catch(() => {});
    callPendingIce = [];
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    callSend("answer", { sdp: answer });
    state.call.state = "connected"; startCallTimer(); render();
  } catch (e) { promptCallFallback("microphone unavailable"); }
}
function startCallTimer() {
  track(setInterval(() => {
    if (state.call.state !== "connected") return;
    state.call.seconds++;
    const el = document.querySelector("[data-call-timer]");
    if (el) {
      const mm = String(Math.floor(state.call.seconds / 60)).padStart(2, "0");
      const ss = String(state.call.seconds % 60).padStart(2, "0");
      el.textContent = `${mm}:${ss}`;
    }
  }, 1000));
}
function teardownCall() {
  clearCallFallback();
  if (callPC) { try { callPC.getSenders().forEach((s) => s.track && s.track.stop()); callPC.close(); } catch (e) {} callPC = null; }
  if (callLocalStream) { callLocalStream.getTracks().forEach((t) => t.stop()); callLocalStream = null; }
  callPendingIce = [];
}
function callRing() { state.call.state = "ringing-out"; render(); armCallFallback(25000, "no answer"); whenCallChannelReady(() => callSend("ring")); }
function callCancelOut() { callSend("cancel"); teardownCall(); state.call = idleCall(); render(); }
function callAccept() { callSend("accept"); state.call.state = "connecting"; render(); armCallFallback(20000, "couldn't connect"); }
function callDecline() { callSend("cancel"); teardownCall(); state.call = idleCall(); render(); }
function callHangup() { callSend("hangup"); teardownCall(); state.call.state = "ended"; render(); track(setTimeout(() => { state.call.state = "idle"; render(); }, 1200)); }
function callToggleMute() {
  const track_ = callLocalStream && callLocalStream.getAudioTracks()[0];
  if (track_) { track_.enabled = !track_.enabled; state.call.muted = !track_.enabled; render(); }
}

    case "close-sidebar": closeSidebar(); break;

    case "go-dashboard": goDashboard(); break;
    case "sign-out": void signOut(); break;

    case "toggle-problem": toggleProblem(payload); break;
    case "submit-request": void submitRequest(); break;
    case "cancel-request": void cancelRequest(); break;
    case "set-payment": state.customer.payment = payload; render(); break;
    case "set-fuel": state.customer.fuelQty = payload; render(); break;
    case "set-vehicle": {
      if (state.customer.vehicleType !== payload) {
        state.customer.vehicleType = payload;
        state.customer.problems = [];
        state.customer.fuelQty = "0.5";
      }
      render(); break;
    }
    case "copy-payment": void copyToClipboard(payload, "Account number"); break;
    case "submit-tx": void submitTransactionId(); break;

    case "open-feedback": openFeedbackModal(); break;
    case "close-feedback": closeFeedbackModal(); break;
    case "skip-feedback": void finalizeAndDismiss(true); break;
    case "submit-feedback": void finalizeAndDismiss(false); break;
    case "set-feedback-rating": state.feedbackModal.rating = Number(payload) || 0; render(); break;

    case "toggle-online": void toggleOnline(); break;
    case "accept-job": { const job = state.mechanic.jobs.find((j) => j.id === payload); if (job) void acceptJob(job); break; }
    case "job-otw": { const job = state.mechanic.jobs.find((j) => j.mechanic_id === state.uid); if (job) void setJobStatus(job, "on_the_way"); break; }
    case "job-done": { const job = state.mechanic.jobs.find((j) => j.mechanic_id === state.uid); if (job) void completeJob(job); break; }
    case "job-release": { const job = state.mechanic.jobs.find((j) => j.mechanic_id === state.uid); if (job) void releaseJob(job); break; }
    case "retry-photo-upload": retryPhotoUpload(payload); break;

    case "open-expertise-modal": openExpertiseModal(); break;
    case "close-expertise-modal": closeExpertiseModal(); break;
    case "toggle-expertise": {
      if (isMechanicExpertiseLocked()) {
        toast("Area of expertise is locked after registration.", "default");
        break;
      }
      const arr = state.expertiseModal.selected;
      const idx = arr.indexOf(payload);
      if (idx >= 0) arr.splice(idx, 1); else arr.push(payload);
      render(); break;
    }
    case "toggle-auth-expertise": {
      const arr = state.auth.expertise;
      const idx = arr.indexOf(payload);
      if (idx >= 0) arr.splice(idx, 1); else arr.push(payload);
      render(); break;
    }
    case "save-expertise": void saveExpertise(); break;

    case "enable-notifications": void enableNotifications(); break;

    case "open-chat": openChat(payload, state._callPeerLabel, state._callPeerPhone); break;
    case "close-chat": closeChat(); break;
    case "send-chat": void sendChatMessage(); break;
    case "dial-peer": dialPeer(); break;

    case "call-open": ensureCallChannel(payload, state._callPeerLabel, state._callPeerPhone); callRing(); break;
    case "call-cancel": callCancelOut(); break;
    case "call-accept": callAccept(); break;
    case "call-decline": callDecline(); break;
    case "call-hangup": callHangup(); break;
    case "call-mute": callToggleMute(); break;
    case "call-fallback-chat": callFallbackToChat("manual"); break;
    case "close-call-fallback": closeCallFallback(); break;
    case "call-fallback-retry": callRetryFromFallback(); break;
    case "call-fallback-phone": callPeerViaPhone(); break;
    case "call-fallback-chat-now": callFallbackToChatInstead(); break;
  }

/* ============================= MAP RENDER ============================= */
const bmMapRegistry = new Map();
const pendingMapData = {};

function renderMap(markers, heightClass, key) {
  const mapKey = key || "default";
  pendingMapData[mapKey] = markers || [];
  return `<div class="${heightClass} w-full relative overflow-hidden bg-surface-2"><div class="bm-real-map absolute inset-0" data-bm-map-key="${mapKey}"></div></div>`;
}
function markerKey(m) { return `${m.kind}|${Number(m.lat).toFixed(5)}|${Number(m.lng).toFixed(5)}|${m.label || ""}|${m.vehicleType || ""}`; }

let _leafletLoading = null;
function ensureLeaflet() {
  if (window.L) return Promise.resolve(window.L);
  if (_leafletLoading) return _leafletLoading;
  _leafletLoading = new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.async = true;
    s.onload = () => resolve(window.L);
    s.onerror = () => { _leafletLoading = null; reject(new Error("Leaflet failed to load")); };
    document.head.appendChild(s);
  });
  return _leafletLoading;
}

function initRealMaps() {
  const placeholders = document.querySelectorAll("[data-bm-map-key]");
  if (!placeholders.length) return;

  if (!window.L) {
    // Lazy-load Leaflet on first use — saves ~40 KB on the initial page load.
    placeholders.forEach((el) => {
      if (el.dataset.bmLoading) return;
      el.dataset.bmLoading = "1";
      el.innerHTML = '<div style="position:absolute;inset:0;display:grid;place-items:center;gap:6px;background:var(--surface-2);color:var(--muted-foreground);font-size:12px"><span style="display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:fws-spin 0.8s linear infinite"></span>Loading map…</div>';
    });
    ensureLeaflet()
      .then(() => { placeholders.forEach((el) => { delete el.dataset.bmLoading; }); initRealMaps(); })
      .catch(() => { placeholders.forEach((el) => { el.innerHTML = '<div style="position:absolute;inset:0;display:grid;place-items:center;color:var(--muted-foreground);font-size:12px">Map unavailable offline</div>'; }); });
    return;
  }

  document.querySelectorAll("[data-bm-map-key]").forEach((el) => {
    delete el.dataset.bmLoading;
    const key = el.getAttribute("data-bm-map-key");
    const markers = pendingMapData[key] || [];

    let rec = bmMapRegistry.get(key);
    if (!rec || rec.el !== el) {
      if (rec && rec.map) { try { rec.map.remove(); } catch (e) {} }
      el.innerHTML = "";                                    // clear "Loading map…"
      const map = L.map(el, { zoomControl: true, attributionControl: true, preferCanvas: true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);
      rec = { el, map, markerLayers: new Map(), lastBoundsKey: "" };
      bmMapRegistry.set(key, rec);
    }

    const valid = markers.filter((m) => Number.isFinite(Number(m.lat)) && Number.isFinite(Number(m.lng)));
    const wanted = new Map();
    valid.forEach((m) => wanted.set(markerKey(m), m));

    rec.markerLayers.forEach((layerRec, k) => {
      if (!wanted.has(k)) { try { rec.map.removeLayer(layerRec.layer); } catch (e) {} rec.markerLayers.delete(k); }
    });
    wanted.forEach((m, k) => {
      if (rec.markerLayers.has(k)) return;
      const isMech = m.kind === "mechanic";
      const isCar = m.vehicleType === "car";
      const markerIcon = L.divIcon({
        className: "",
        html: `<div class="bm-pin ${isMech ? "mechanic" : "customer"}">${isMech ? "🔧" : (isCar ? "🚗" : "🏍️")}</div>`,
        iconSize: [34, 34], iconAnchor: [17, 17],
      });
      const layer = L.marker([Number(m.lat), Number(m.lng)], { icon: markerIcon }).addTo(rec.map);
      if (m.label) layer.bindTooltip(esc(m.label), { direction: "top", offset: [0, -16] });
      rec.markerLayers.set(k, { layer, data: m });
    });

    const boundsKey = valid.map((m) => `${m.lat},${m.lng}`).sort().join(";");
    if (boundsKey !== rec.lastBoundsKey) {
      rec.lastBoundsKey = boundsKey;
      const bounds = valid.map((m) => [Number(m.lat), Number(m.lng)]);
      if (bounds.length === 0) rec.map.setView([31.5204, 74.3587], 12);
      else if (bounds.length === 1) rec.map.setView(bounds[0], 15);
      else rec.map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
    }
    setTimeout(() => { try { rec.map.invalidateSize(); } catch (e) {} }, 0);
  });
}

  };

  return `<div class="fixed inset-0 z-50 flex flex-col bg-background overlay-fade" style="padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);" role="dialog" aria-modal="true" aria-label="Call">

      <p class="mt-6 font-display text-2xl font-semibold uppercase tracking-wide text-foreground">${esc(c.peerLabel)}</p>
      <p class="mt-2 text-sm text-muted-foreground" data-call-timer>${statusText}</p>
      <p class="mt-3 text-xs text-muted-foreground">In-app call. If it can't connect, we'll show phone and chat options.</p>
    </div>
    <div class="px-6 pb-10">
      <div class="flex items-center justify-center gap-6">
        ${c.state === "ringing-out" ? roundBtn("call-cancel", "destructive", "Cancel", "phoneOff", true) : ""}
        ${c.state === "ringing-in" ? roundBtn("call-decline", "destructive", "Decline", "phoneOff", true) + roundBtn("call-accept", "accent", "Accept", "phone", true) : ""}
        ${c.state === "connecting" || c.state === "connected" ? roundBtn("call-mute", "muted", c.muted ? "Unmute" : "Mute", c.muted ? "micOff" : "mic") + roundBtn("call-hangup", "destructive", "End call", "phoneOff", true) : ""}

function renderCallFallbackModal() {
  const fb = state.callFallback;

function screenCustomer() {
  const p = state.profile, c = state.customer, coords = state.geo.coords;
  const markers = [];
  const me = c.active && c.active.lat != null ? { lat: c.active.lat, lng: c.active.lng } : coords;
  if (me) markers.push({ lat: me.lat, lng: me.lng, kind: "customer", label: "You", vehicleType: (c.active && c.active.vehicle_type) || c.vehicleType });
  if (c.mechanic && c.mechanic.lat != null) markers.push({ lat: c.mechanic.lat, lng: c.mechanic.lng, kind: "mechanic", label: c.mechanic.full_name || "Mechanic" });
  if (me) state.presence.list.forEach((p2) => {
    if (c.active && p2.id === c.active.mechanic_id) return;
    if (distanceKm(me, p2) > 8) return;
    markers.push({ lat: p2.lat, lng: p2.lng, kind: "mechanic", label: `${p2.full_name || "Mechanic"} · online` });
  });
  const active = c.active;

      </div>` : ""}

              const done = !!myJob[w + "_photo_url"];
              const src = m[w + "Preview"] || myJob[w + "_photo_url"];
              const lockKey = myJob.id + ":" + w;
              const errMsg = m.uploadErrors[lockKey];
              return `
            <label class="relative block aspect-square overflow-hidden rounded-lg border-2 ${src ? "border-solid" : "border-dashed"} border-border bg-surface transition-colors ${locked ? "pointer-events-none opacity-50" : "cursor-pointer hover:border-primary"}">
              <input type="file" accept="image/*" capture="environment" data-jobphoto="${w}" data-jobid="${attr(myJob.id)}" class="hidden" ${locked ? "disabled" : ""} aria-label="${w} photo" />
              ${m[w + "Compressing"]
                ? `<span class="absolute inset-0 grid place-items-center">${icon("loader", "h-5 w-5 text-muted-foreground")}</span>`
                : src
                ? `<img src="${attr(src)}" alt="${w} photo" width="600" height="600" loading="lazy" decoding="async" class="absolute inset-0 h-full w-full object-cover" onerror="this.dataset.retries=(+this.dataset.retries||0)+1; if(this.dataset.retries<3){const s=this.src;this.src='';this.src=s;}" />`
                : `<span class="absolute inset-0 grid place-items-center gap-1 text-center">${locked ? icon("lock", "h-5 w-5 text-muted-foreground") : icon("camera", "h-5 w-5 text-muted-foreground")}<span class="px-1 text-[11px] text-muted-foreground">${locked ? "Upload before first" : `${w === "before" ? "Before" : "After"} photo`}</span></span>`}
              ${m[w + "Uploading"] ? `<span class="absolute inset-0 grid place-items-center bg-background/70 text-center"><span class="font-display text-xs font-semibold text-foreground">${icon("loader", "mx-auto h-4 w-4 text-primary")}<br>${m[w + "UploadPct"]}%</span></span>` : ""}
              ${errMsg && !m[w + "Uploading"] ? `<button type="button" data-action="retry-photo-upload" data-payload="${w}" class="absolute inset-0 grid place-items-center bg-destructive/85 text-center text-destructive-foreground"><span class="px-1 text-[10px] font-semibold leading-tight">Upload failed<br>Tap to retry</span></button>` : ""}
              ${done && !m[w + "Uploading"] && !errMsg ? `<span class="absolute right-1.5 top-1.5 grid h-5 w-5 place-items-center rounded-full bg-success text-white toast-pop">${icon("check", "h-3 w-3")}</span>` : ""}
            </label>`;
            }).join("")}
          </div>
        </div>
        <div class="mt-4 flex flex-wrap gap-2">
          ${myJob.status === "accepted" ? `<button type="button" data-action="job-otw" ${m.busyId === myJob.id ? "disabled" : ""} class="inline-flex items-center gap-2 rounded-full bg-primary px-5 py-3 font-display text-sm font-semibold uppercase tracking-wide text-primary-foreground disabled:opacity-60 active:scale-95 transition-transform">${icon("nav", "h-4 w-4")} On the way</button>` : ""}
          ${myJob.status === "on_the_way" ? `<button type="button" data-action="job-done" ${m.completing || !myJob.before_photo_url || !myJob.after_photo_url ? "disabled" : ""} class="inline-flex items-center gap-2 rounded-full bg-primary px-5 py-3 font-display text-sm font-semibold uppercase tracking-wide text-primary-foreground disabled:opacity-60 active:scale-95 transition-transform">${m.completing ? icon("loader", "h-4 w-4") : icon("check", "h-4 w-4")} Job done</button>` : ""}
          <button type="button" data-action="open-chat" data-payload="${attr(myJob.id)}" aria-label="Chat with the customer" class="relative inline-flex items-center gap-2 overflow-visible rounded-full border border-border bg-surface px-5 py-3 font-display text-sm font-semibold uppercase tracking-wide text-foreground active:scale-95 transition-transform">
            ${icon("chat", "h-4 w-4 text-primary")} Chat
            ${unreadBadge(state.chat.unread)}
          </button>
          <button type="button" data-action="call-open" data-payload="${attr(myJob.id)}" class="inline-flex items-center gap-2 rounded-full bg-accent px-5 py-3 font-display text-sm font-semibold uppercase tracking-wide text-accent-foreground active:scale-95 transition-transform">${icon("phone", "h-4 w-4")} Call</button>
          ${myJob.lat != null ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${myJob.lat},${myJob.lng}" target="_blank" rel="noreferrer noopener" class="inline-flex items-center gap-2 rounded-full border border-border bg-surface-2 px-5 py-3 font-display text-sm font-semibold uppercase tracking-wide text-foreground active:scale-95 transition-transform">${icon("mapPin", "h-4 w-4")} Directions</a>` : ""}
          <button type="button" data-action="job-release" ${m.busyId === myJob.id ? "disabled" : ""} class="inline-flex items-center gap-2 rounded-full border border-border bg-surface px-5 py-3 font-display text-sm font-semibold uppercase tracking-wide text-destructive disabled:opacity-60 active:scale-95 transition-transform">${icon("x", "h-4 w-4")} Release</button>
        </div>
      </section>` : ""}

      <section class="mt-6">
        <h2 class="font-display text-xl font-bold uppercase tracking-wide text-foreground">Incoming requests</h2>
        <p dir="rtl" lang="ur" class="font-urdu mt-1 text-sm text-muted-foreground">نئی درخواستیں</p>
        ${!m.online ? `<p class="mt-4 rounded-2xl border border-dashed border-border p-6 text-center text-sm text-muted-foreground">You're offline. Flip the switch above to start receiving jobs.</p>`
          : !hasExpertise ? `<p class="mt-4 rounded-2xl border border-dashed border-accent/60 bg-accent/5 p-6 text-center text-sm text-muted-foreground">Pick your expertise above to start receiving matching jobs.</p>`
          : pending.length === 0 ? `<p class="mt-4 rounded-2xl border border-dashed border-border p-6 text-center text-sm text-muted-foreground">No matching requests right now. We'll show them here the moment they arrive.</p>`
          : `<div class="mt-4 space-y-3">${pending.map((job) => `
            <article class="card-lift card-hover rounded-2xl border border-border bg-surface p-4">
              <div class="flex items-start justify-between gap-3">
                <div class="flex min-w-0 items-center gap-3"><span class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-primary/15">${icon(job.vehicle_type === "car" ? "car" : "bike", "h-5 w-5 text-primary")}</span><div class="min-w-0"><p class="truncate font-display text-base font-semibold text-foreground">${esc(job.customer_name)}</p><p class="truncate text-xs text-muted-foreground">${esc(job.problem_type)}</p></div></div>
                ${coords && job.lat != null ? `<span class="shrink-0 rounded-full bg-surface-2 px-3 py-1 font-display text-xs font-semibold text-accent">~${distanceKm(coords, job).toFixed(1)} km</span>` : ""}
              </div>
              ${jobBody(job, coords, true)}
              <button type="button" data-action="accept-job" data-payload="${attr(job.id)}" ${m.busyId === job.id || myJob ? "disabled" : ""} class="mt-4 inline-flex w-full items-center justify-center gap-2 rounded-full bg-accent px-5 py-3 font-display text-sm font-semibold uppercase tracking-wide text-accent-foreground disabled:opacity-50 active:scale-95 transition-transform">${m.busyId === job.id ? icon("loader", "h-4 w-4") : ""} ${myJob ? "Finish your current job first" : "Accept job"}</button>
            </article>`).join("")}</div>`}
      </section>
    </div></main>`;
}

function jobBody(job, coords, isPending) {
  const km = coords && job.lat != null ? distanceKm(coords, job) : null;
  const labels = parseProblemLabels(job.problem_type);
  return `<dl class="mt-3 space-y-1.5 text-sm">
    ${labels.length > 1
      ? `<div class="rounded-xl bg-surface-2 p-3">
          <p class="text-[11px] font-semibold uppercase tracking-wide text-muted-foreground">Services (${labels.length})</p>
          <ul class="mt-1 space-y-1 text-sm">
            ${labels.map((l) => `<li class="text-foreground">• ${esc(l)}</li>`).join("")}
          </ul>
          ${job.service_price ? `<div class="mt-2 flex justify-between border-t border-border pt-2"><span class="font-semibold text-foreground">Total</span><span class="font-semibold text-accent">${esc(job.service_price)}</span></div>` : ""}
        </div>`
      : rowKV("Problem", job.problem_type)}
    ${labels.length <= 1 && job.service_price ? rowKV("Price", job.service_price) : ""}
    ${job.problem_note ? rowKV("Details", job.problem_note) : ""}
    ${job.vehicle_type ? rowKV("Vehicle", vehicleTypeLabel(job.vehicle_type)) : ""}
    ${job.bike_model ? rowKV("Model", job.bike_model) : ""}
    ${job.bike_reg_no ? rowKV("Reg no", job.bike_reg_no) : ""}
    ${job.landmark ? rowKV("Landmark", job.landmark) : ""}
    ${job.payment_method ? rowKV("Payment", `${paymentLabel(job.payment_method)}${job.payment_method === "cash" ? "" : " → FixWheels"}`) : ""}
    ${km != null ? rowKV("Approx. distance", `${km.toFixed(1)} km · ETA ~${estimateEtaMinutes(km)} min`) : ""}
    ${isPending ? `<p class="mt-1.5 text-[11px] leading-snug text-muted-foreground">Accept the job to see the customer's full address and phone number.</p>` : ""}
  </dl>`;
}

function screenParts() {
  const q = state.partsQuery;
  const groups = groupedParts(q);
  const loading = !state.parts.loaded;
  return `<main class="min-h-screen bg-background"><div class="mx-auto max-w-3xl px-4 pb-14 pt-6">
    <button type="button" data-action="${state.profile ? "go-dashboard" : "back-role"}" class="inline-flex items-center gap-2 text-sm font-medium text-muted-foreground hover:text-foreground active:scale-95 transition-transform">${icon("arrowLeft", "h-4 w-4")} Back</button>
    <h1 class="mt-5 font-display text-3xl font-bold uppercase tracking-wide text-foreground">Mechanical parts rate list</h1>
    <p dir="rtl" lang="ur" class="font-urdu mt-1 text-[15px] text-muted-foreground">پرزوں اور مزدوری کی عام قیمتیں</p>
    <p class="mt-3 text-sm text-muted-foreground">Typical market ranges so you know a fair price before the work starts. Final price depends on brand and vehicle model.</p>
    <div class="mt-3 inline-flex items-center gap-2 rounded-full border border-border bg-surface-2 px-3 py-1.5">
      <span class="pulse-dot h-2 w-2 rounded-full" style="background: var(--success)"></span>
      <span class="text-[11px] font-medium uppercase tracking-widest text-muted-foreground">Live from FixWheels · updates instantly</span>
    </div>
    <div class="relative mt-6"><span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground">${icon("search", "h-4 w-4")}</span><input data-bind="parts.query" value="${attr(state.partsQuery)}" placeholder="Search a part, e.g. tube, oil, brake" aria-label="Search parts" class="w-full rounded-xl border border-border bg-surface py-3 pl-11 pr-4 text-sm text-foreground placeholder:text-muted-foreground focus:border-primary focus:outline-none transition-colors" /></div>
    ${state.parts.error ? `<p class="mt-6 rounded-xl border border-destructive bg-destructive/10 px-4 py-3 text-sm text-destructive">Couldn't load the live rate list (${esc(state.parts.error)}). Please check your connection and try again.</p>` : ""}
    ${loading ? `<div class="mt-8 grid place-items-center">${icon("loader", "h-6 w-6 text-primary")}</div>`
      : groups.length === 0 ? `<p class="mt-8 text-sm text-muted-foreground">${state.parts.rows.length === 0 ? "The rate list is empty right now — please check back shortly." : `Nothing matched "${esc(state.partsQuery)}".`}</p>`
      : `<div class="mt-6 space-y-6">${groups.map(([cat, rows]) => `
      <section class="overflow-hidden rounded-2xl border border-border bg-surface card-lift"><h2 class="border-b border-border bg-surface-2 px-4 py-3 font-display text-sm font-semibold uppercase tracking-widest text-accent">${esc(cat)}</h2>
        <ul class="divide-y divide-border">${rows.map((r) => {
          const hasLo = r.price_min !== null && r.price_min !== undefined && r.price_min !== "";
          const hasHi = r.price_max !== null && r.price_max !== undefined && r.price_max !== "";
          const lo = hasLo ? Number(r.price_min) : null;
          const hi = hasHi ? Number(r.price_max) : null;
          const unitLabel = r.unit || "PKR";
          let priceText;
          if (lo != null && hi != null) priceText = lo === hi ? money(lo) : `${money(lo)} – ${money(hi)}`;
          else if (lo != null) priceText = money(lo);
          else if (hi != null) priceText = money(hi);
          else priceText = "On request";
          return `<li class="flex items-center justify-between gap-4 px-4 py-3"><div class="min-w-0"><p class="truncate text-sm font-medium text-foreground">${esc(r.name_en)}</p><p dir="rtl" lang="ur" class="font-urdu truncate text-xs text-muted-foreground">${esc(r.name_ur)}</p></div><div class="shrink-0 text-right"><p class="font-display text-sm font-semibold text-foreground">${priceText}</p><p class="text-[11px] uppercase tracking-wide text-muted-foreground">${esc(unitLabel)}</p></div></li>`;
        }).join("")}</ul>
      </section>`).join("")}</div>`}
  </div></main>`;
}

/* ============================= RENDER ============================= */
function renderNow() {
  applyTheme();
  const app = document.getElementById("app");
  const activeEl = document.activeElement;
  let restoreFocus = null;
  if (activeEl && app.contains(activeEl) && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA") && activeEl.hasAttribute("data-bind")) {
    let selStart = null, selEnd = null;
    try { selStart = activeEl.selectionStart; selEnd = activeEl.selectionEnd; } catch (e) {}
    restoreFocus = { bind: activeEl.getAttribute("data-bind"), selStart, selEnd };
  }

  const preservedMaps = new Map();
  app.querySelectorAll("[data-bm-map-key]").forEach((el) => {
    const k = el.getAttribute("data-bm-map-key");
    const rec = bmMapRegistry.get(k);
    if (rec && rec.el === el) {
      if (el.parentNode) el.parentNode.removeChild(el);
      preservedMaps.set(k, el);
    }
  });

  let body = "";
  switch (state.screen) {
    case "boot": body = screenBoot(); break;
    case "role": body = screenRole(); break;
    case "auth": body = screenAuth(); break;
    case "customer": body = state.profile ? screenCustomer() : screenRole(); break;
    case "mechanic": body = state.profile ? screenMechanic() : screenRole(); break;
    case "parts": body = screenParts(); break;
    default: body = screenRole();
  }

  // Screen transition animation — only when the "screen key" changes, so typing
  // and small state updates don't restart the fade.
  const screenKey = [state.screen, state.profile ? state.profile.role : "", state.customer.active ? state.customer.active.id : ""].join("|");
  const screenChanged = state._screenKey !== screenKey;
  state._screenKey = screenKey;

  app.innerHTML =
    `<div class="${screenChanged ? "screen-fade-in" : ""}">${body}</div>` +
    sidebar() +
    renderCallOverlay() +
    renderCallFallbackModal() +
    renderChatOverlay() +
    renderFeedbackModal() +
    renderExpertiseModal() +
    renderToasts();

  app.querySelectorAll("[data-bm-map-key]").forEach((placeholder) => {
    const k = placeholder.getAttribute("data-bm-map-key");
    const saved = preservedMaps.get(k);
    if (saved && placeholder.parentNode) placeholder.parentNode.replaceChild(saved, placeholder);
  });

  requestAnimationFrame(initRealMaps);

  if (restoreFocus) {
    const el = app.querySelector(`[data-bind="${CSS.escape(restoreFocus.bind)}"]`);
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
      el.focus({ preventScroll: true });
      if (typeof restoreFocus.selStart === "number" && el.setSelectionRange) {
        try { el.setSelectionRange(restoreFocus.selStart, restoreFocus.selEnd); } catch (e) {}
      }
    }
  }
}


/* Coalesce bursts of state changes into one render per frame, and don't replay
   entrance animations on overlays that were already open. */
let _renderQueued = false;
function render() {
  if (_renderQueued) return;
  _renderQueued = true;
  requestAnimationFrame(flushRender);
}
function flushRender() {
  _renderQueued = false;
  const appEl = document.getElementById("app");
  const classes = ["modal-pop", "overlay-fade", "sidebar-slide", "toast-pop"];
  const had = {};
  classes.forEach((c) => { had[c] = appEl.querySelectorAll("." + c).length; });
  renderNow();
  classes.forEach((c) => {
    appEl.querySelectorAll("." + c).forEach((el, i) => { if (i < had[c]) el.style.animation = "none"; });
  });
  appEl.querySelectorAll("img:not([loading])").forEach((im) => {
    if (im.id === "fw-splash-logo") return;
    im.loading = "lazy";
    im.decoding = "async";
  });
}

/* ============================= BOOT ============================= */
void boot();

    } catch (err) {
      console.error("FixWheels failed to boot:", err);
      fatal(err && err.message ? err.message : "Unexpected error while starting the app.");
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bootApp);
  else bootApp();
})();
</script>
</body>
